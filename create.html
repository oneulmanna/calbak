<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <title>약속 만들기 · 캘박</title>
  <link rel="icon" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="page">
    <section class="sheet">
      <div class="sheet-inner sheet-content">
        <header class="page-header">
          <a class="back-button" href="./index.html" aria-label="뒤로">←</a>
          <span class="page-badge">NEW ROOM</span>
        </header>

        <div class="title-block">
          <p class="eyebrow">CREATE</p>
          <h1 class="page-title">약속 만들기</h1>
          <p class="subtitle">날짜 범위를 정해서 방을 만들고 링크를 공유하세요.</p>
        </div>

        <div class="account-card" id="account-card">
          <div class="account-avatar" id="account-avatar">?</div>
          <div class="account-copy">
            <strong id="account-name">카카오 사용자</strong>
            <span>이 카카오 계정으로 약속을 만듭니다.</span>
          </div>
        </div>

        <form class="form" id="create-form">
          <div class="field">
            <label for="title">약속 이름</label>
            <input class="input" id="title" maxlength="60" required placeholder="예: 8월 저녁 약속">
          </div>

          <div class="field">
            <label for="memo">메모</label>
            <textarea class="textarea" id="memo" maxlength="500" placeholder="장소, 시간대, 참고사항 등을 적어주세요."></textarea>
          </div>

          <div class="field">
            <span class="field-label">날짜 범위</span>
            <div class="preset-grid">
              <button class="preset" type="button" data-preset="this-week">이번주</button>
              <button class="preset" type="button" data-preset="next-week">다음주</button>
              <button class="preset active" type="button" data-preset="this-month">이번달</button>
              <button class="preset" type="button" data-preset="next-month">다음달</button>
            </div>
            <div class="date-pair">
              <input class="input" id="start-date" type="date" required>
              <input class="input" id="end-date" type="date" required>
            </div>
            <p class="helper">날짜 범위는 최대 120일까지 선택할 수 있습니다.</p>
          </div>

          <button class="button primary" id="create-button" type="submit">방 만들기</button>
        </form>

        <footer class="footer">MADE BY <strong>KIM INHO</strong></footer>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./assets/common.js"></script>
  <script>
    const {
      qs, qsa, dateToISO, addDays, createCode, setLoading,
      showToast, configError, getClient, requireUser, getProfile,
      saveRoomHistory, escapeHtml
    } = App;

    const form = qs("#create-form");
    const startInput = qs("#start-date");
    const endInput = qs("#end-date");
    const createButton = qs("#create-button");
    let user = null;

    function rangeFor(preset) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const day = today.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const thisMonday = addDays(today, mondayOffset);

      if (preset === "this-week") return [thisMonday, addDays(thisMonday, 6)];
      if (preset === "next-week") {
        const start = addDays(thisMonday, 7);
        return [start, addDays(start, 6)];
      }
      if (preset === "next-month") {
        return [
          new Date(today.getFullYear(), today.getMonth() + 1, 1),
          new Date(today.getFullYear(), today.getMonth() + 2, 0)
        ];
      }
      return [
        new Date(today.getFullYear(), today.getMonth(), 1),
        new Date(today.getFullYear(), today.getMonth() + 1, 0)
      ];
    }

    function applyPreset(preset) {
      const [start, end] = rangeFor(preset);
      startInput.value = dateToISO(start);
      endInput.value = dateToISO(end);
      qsa(".preset").forEach((button) => {
        button.classList.toggle("active", button.dataset.preset === preset);
      });
    }

    qsa(".preset").forEach((button) => {
      button.addEventListener("click", () => applyPreset(button.dataset.preset));
    });

    [startInput, endInput].forEach((input) => {
      input.addEventListener("change", () => {
        qsa(".preset").forEach((button) => button.classList.remove("active"));
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!user) return;

      const start = new Date(`${startInput.value}T00:00:00`);
      const end = new Date(`${endInput.value}T00:00:00`);
      const dayCount = Math.round((end - start) / 86400000) + 1;

      if (!startInput.value || !endInput.value || end < start) {
        showToast("날짜 범위를 다시 확인해주세요.", "error");
        return;
      }
      if (dayCount > 120) {
        showToast("날짜 범위는 최대 120일까지 가능합니다.", "error");
        return;
      }

      setLoading(createButton, true, "방 만드는 중");
      try {
        const sb = getClient();
        const payload = {
          code: createCode(),
          title: qs("#title").value.trim(),
          memo: qs("#memo").value.trim(),
          start_date: startInput.value,
          end_date: endInput.value
        };

        const { data, error } = await sb
          .from("rooms")
          .insert(payload)
          .select()
          .single();

        if (error) throw error;
        saveRoomHistory(data);
        location.href = `./room.html?code=${encodeURIComponent(data.code)}`;
      } catch (error) {
        console.error(error);
        showToast(error.message || "방을 만들지 못했습니다.", "error");
        setLoading(createButton, false);
      }
    });

    async function boot() {
      try {
        user = await requireUser(location.href);
        const profile = getProfile(user);
        qs("#account-name").textContent = profile.name;
        qs("#account-avatar").innerHTML = profile.avatar
          ? `<img src="${escapeHtml(profile.avatar)}" alt="">`
          : escapeHtml(profile.name.slice(0, 1));
      } catch (error) {
        if (error.message !== "AUTH_REDIRECT" && !configError(error)) {
          showToast(error.message || "로그인이 필요합니다.", "error");
        }
      }
    }

    applyPreset("this-month");
    boot();
  </script>
</body>
</html>
